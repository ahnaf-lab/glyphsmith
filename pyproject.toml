[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glyphsmith"
version = "0.1.0"
description = "Deterministically forge a bitmap typeface from a seed string."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
glyphsmith = "glyphsmith.cli:main"

[tool.setuptools.packages.find]
include = ["glyphsmith*"]
